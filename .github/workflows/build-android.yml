name: Build & Test BRIDGE for Android

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android unit tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug & Release APKs
        env:
          BRIDGE_KEYSTORE_PATH: ${{ secrets.BRIDGE_KEYSTORE_PATH }}
          BRIDGE_KEYSTORE_PASSWORD: ${{ secrets.BRIDGE_KEYSTORE_PASSWORD }}
          BRIDGE_KEY_ALIAS: ${{ secrets.BRIDGE_KEY_ALIAS }}
          BRIDGE_KEY_PASSWORD: ${{ secrets.BRIDGE_KEY_PASSWORD }}
        run: gradle assembleDebug assembleRelease --no-daemon

      - name: Verify APK integrity & compute SHA-256
        run: |
          mkdir -p dist-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk dist-artifacts/Bridge-Android-debug.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist-artifacts/Bridge-Android.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist-artifacts/Bridge-Android-unsigned.apk
          fi
          for f in dist-artifacts/*.apk; do
            unzip -tq "$f"
            ls -lh "$f"
          done
          sha256sum dist-artifacts/*.apk > dist-artifacts/SHA256SUMS-android.txt
          cat dist-artifacts/SHA256SUMS-android.txt

      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bridge-android-apk
          path: android/dist-artifacts/*
          if-no-files-found: error
